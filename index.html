<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>核医学検査学 過去問160問演習マスター</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            },
            accent: {
              500: '#06b6d4',
              600: '#0891b2',
            }
          }
        }
      }
    }
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
    body { font-family: 'Noto Sans JP', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #475569;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-full flex flex-col transition-colors duration-200">

  <!-- ヘッダー -->
  <header class="sticky top-0 z-30 bg-white/90 dark:bg-slate-800/90 backdrop-blur border-b border-slate-200 dark:border-slate-700 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="showDashboard()">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-cyan-500 flex items-center justify-center text-white font-bold text-xl shadow-md">
          核
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight">核医学検査学 演習</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400">全160問 診療放射線技師国家試験対策</p>
        </div>
      </div>
      
      <div class="flex items-center space-x-2">
        <button onclick="toggleDarkMode()" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-700 transition" title="ダークモード切替">
          <i id="theme-icon" class="fas fa-moon text-lg"></i>
        </button>
        <button onclick="showDashboard()" class="px-3 py-1.5 text-sm font-medium rounded-lg bg-indigo-50 dark:bg-slate-700 text-indigo-600 dark:text-indigo-300 hover:bg-indigo-100 dark:hover:bg-slate-600 transition">
          <i class="fas fa-home mr-1"></i> ホーム
        </button>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6">

    <!-- 1. ダッシュボード画面 -->
    <div id="view-dashboard" class="space-y-6">
      
      <!-- 学習状況サマリー -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center space-x-3">
          <div class="p-3 bg-indigo-100 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 rounded-xl">
            <i class="fas fa-tasks text-xl"></i>
          </div>
          <div>
            <div class="text-xs text-slate-500 dark:text-slate-400">解答済み問題</div>
            <div class="text-xl font-bold" id="stat-answered">0 / 160</div>
          </div>
        </div>

        <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center space-x-3">
          <div class="p-3 bg-emerald-100 dark:bg-emerald-950 text-emerald-600 dark:text-emerald-400 rounded-xl">
            <i class="fas fa-chart-line text-xl"></i>
          </div>
          <div>
            <div class="text-xs text-slate-500 dark:text-slate-400">総合正答率</div>
            <div class="text-xl font-bold" id="stat-accuracy">0%</div>
          </div>
        </div>

        <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center space-x-3">
          <div class="p-3 bg-amber-100 dark:bg-amber-950 text-amber-600 dark:text-amber-400 rounded-xl">
            <i class="fas fa-bookmark text-xl"></i>
          </div>
          <div>
            <div class="text-xs text-slate-500 dark:text-slate-400">ブックマーク</div>
            <div class="text-xl font-bold" id="stat-bookmarks">0</div>
          </div>
        </div>

        <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center space-x-3">
          <div class="p-3 bg-rose-100 dark:bg-rose-950 text-rose-600 dark:text-rose-400 rounded-xl">
            <i class="fas fa-exclamation-triangle text-xl"></i>
          </div>
          <div>
            <div class="text-xs text-slate-500 dark:text-slate-400">要復習問題</div>
            <div class="text-xl font-bold" id="stat-wrong">0</div>
          </div>
        </div>
      </div>

      <!-- 設定 & 特殊モード -->
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
        <h2 class="font-bold text-base flex items-center text-slate-700 dark:text-slate-200">
          <i class="fas fa-sliders-h mr-2 text-indigo-500"></i> 学習アシスト設定 & 特別モード
        </h2>
        
        <div class="flex flex-wrap gap-4 items-center justify-between pt-1">
          <div class="flex flex-wrap gap-4">
            <label class="flex items-center space-x-2 text-sm cursor-pointer select-none">
              <input type="checkbox" id="setting-shuffle-q" class="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500">
              <span>出題順をシャッフル</span>
            </label>
            <label class="flex items-center space-x-2 text-sm cursor-pointer select-none">
              <input type="checkbox" id="setting-shuffle-o" class="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500">
              <span>選択肢をシャッフル</span>
            </label>
          </div>

          <div class="flex flex-wrap gap-2">
            <button onclick="startMode('random_all')" class="px-4 py-2 bg-gradient-to-r from-indigo-600 to-blue-600 text-white rounded-xl font-medium text-sm hover:from-indigo-700 hover:to-blue-700 shadow transition flex items-center">
              <i class="fas fa-random mr-2"></i> 全160問ランダム演習
            </button>
            <button onclick="startMode('bookmarks')" class="px-4 py-2 bg-amber-500 text-white rounded-xl font-medium text-sm hover:bg-amber-600 shadow transition flex items-center">
              <i class="fas fa-bookmark mr-2"></i> 保存した問題 (<span id="btn-bookmark-count">0</span>)
            </button>
            <button onclick="startMode('wrong')" class="px-4 py-2 bg-rose-500 text-white rounded-xl font-medium text-sm hover:bg-rose-600 shadow transition flex items-center">
              <i class="fas fa-history mr-2"></i> 間違えた問題 (<span id="btn-wrong-count">0</span>)
            </button>
          </div>
        </div>
      </div>

      <!-- 分野別セクション (8スライド) -->
      <div>
        <h2 class="font-bold text-lg text-slate-800 dark:text-slate-100 mb-4 flex items-center">
          <i class="fas fa-layer-group text-indigo-500 mr-2"></i> 分野別演習（各20問）
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4" id="section-grid">
          <!-- JSで動的生成 -->
        </div>
      </div>
    </div>

    <!-- 2. クイズプレイ画面 -->
    <div id="view-quiz" class="hidden max-w-3xl mx-auto space-y-6">
      
      <!-- クイズプログレスバー & ヘッダー -->
      <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <button onclick="showDashboard()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition">
            <i class="fas fa-arrow-left text-lg"></i>
          </button>
          <div>
            <span id="quiz-category-badge" class="px-2.5 py-1 text-xs font-semibold rounded-md bg-indigo-100 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-300">
              カテゴリー
            </span>
            <span id="quiz-progress-text" class="text-xs text-slate-500 dark:text-slate-400 ml-2">問題 1 / 20</span>
          </div>
        </div>

        <button id="quiz-bookmark-btn" onclick="toggleBookmarkCurrent()" class="text-slate-400 hover:text-amber-500 text-xl transition">
          <i class="far fa-bookmark"></i>
        </button>
      </div>

      <!-- プログレスバー -->
      <div class="w-full bg-slate-200 dark:bg-slate-700 h-2 rounded-full overflow-hidden">
        <div id="quiz-progress-bar" class="bg-indigo-600 h-full w-0 transition-all duration-300"></div>
      </div>

      <!-- 問題カード -->
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-md space-y-6">
        
        <div class="flex items-start justify-between gap-3">
          <h3 id="quiz-question-text" class="text-base md:text-lg font-bold leading-relaxed text-slate-800 dark:text-slate-100">
            問題文がここに入ります
          </h3>
          <span id="quiz-multi-badge" class="shrink-0 px-2.5 py-1 text-xs font-bold rounded-lg bg-amber-100 dark:bg-amber-950 text-amber-700 dark:text-amber-300">
            単一選択
          </span>
        </div>

        <!-- 選択肢リスト -->
        <div id="quiz-options-container" class="space-y-3">
          <!-- JSで動的生成 -->
        </div>

        <!-- 判定・解説領域 (回答後に表示) -->
        <div id="quiz-explanation-box" class="hidden p-5 rounded-xl border space-y-3">
          <div class="flex items-center space-x-2 font-bold text-lg" id="quiz-result-title">
            <!-- JSで動的生成 -->
          </div>
          <div id="quiz-explanation-text" class="text-sm leading-relaxed text-slate-700 dark:text-slate-300 whitespace-pre-wrap border-t pt-3 border-slate-200 dark:border-slate-700">
            <!-- 解説文 -->
          </div>
        </div>

        <!-- 操作ボタン -->
        <div class="flex justify-end space-x-3 pt-2">
          <button id="btn-submit-answer" onclick="submitAnswer()" class="w-full md:w-auto px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow-md transition">
            回答を送信
          </button>
          <button id="btn-next-question" onclick="nextQuestion()" class="hidden w-full md:w-auto px-6 py-3 bg-slate-800 hover:bg-slate-900 dark:bg-slate-700 dark:hover:bg-slate-600 text-white font-bold text-sm rounded-xl shadow-md transition">
            次の問題へ <i class="fas fa-chevron-right ml-1"></i>
          </button>
        </div>

      </div>
    </div>

    <!-- 3. 結果サマリー画面 -->
    <div id="view-result" class="hidden max-w-2xl mx-auto space-y-6">
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-8 border border-slate-200 dark:border-slate-700 shadow-lg text-center space-y-6">
        <div class="inline-flex p-4 rounded-full bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 mb-2">
          <i class="fas fa-award text-4xl"></i>
        </div>
        <h2 class="text-2xl font-bold">演習終了！</h2>
        
        <div class="bg-slate-50 dark:bg-slate-900/50 p-6 rounded-xl space-y-2 border border-slate-100 dark:border-slate-800">
          <div class="text-xs text-slate-500 dark:text-slate-400">正解率</div>
          <div class="text-4xl font-extrabold text-indigo-600 dark:text-indigo-400" id="result-score-percent">0%</div>
          <div class="text-sm text-slate-600 dark:text-slate-300" id="result-score-detail">20問中 18問正解</div>
        </div>

        <div class="flex flex-col md:flex-row gap-3 pt-2">
          <button onclick="restartCurrentQuiz()" class="flex-1 px-4 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow transition">
            <i class="fas fa-redo mr-2"></i> もう一度解く
          </button>
          <button onclick="showDashboard()" class="flex-1 px-4 py-3 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-bold text-sm rounded-xl transition">
            <i class="fas fa-th-large mr-2"></i> 分野一覧に戻る
          </button>
        </div>
      </div>
    </div>

  </main>

  <!-- 全160問のデータベース & アプリロジック -->
  <script>
    // --- 160問 全問題データ ---
    const rawQuizData = [
      // === スライド1: PET装置 (20問) ===
      {
        id: "pet_1", slide: 1, category: "PET装置",
        question: "1 PET で誤っているのはどれか。",
        options: ["1. 消滅放射線を測定する。", "2. 同時計数によってデータを収集する。", "3. 被験者の被ばく線量はSPECT より多い。", "4. 使用する放射性医薬品の半減期は短いものが多い。", "5. 減弱補正はCT画像で補正することで正確に行える。"],
        answers: [2], multi: false,
        explanation: "【誤り：3】PETの被ばく線量はSPECTと同等程度であり、「SPECTより極めて多い」わけではありません。\n※消滅放射線(511keV)の同時計数を用いてデータ収集を行います。"
      },
      {
        id: "pet_2", slide: 1, category: "PET装置",
        question: "2 PET で正しいのはどれか。2つ選べ。",
        options: ["1. 陽電子の飛程が長いと空間分解能が改善する。", "2. BGOはLSOと比較してエネルギー分解能が高い。", "3. 2D収集は3D収集と比較して感度が高い。", "4. 投与量と真の同時計数は比例している。", "5. 計測する放射線のエネルギーは核種によらず一定である。"],
        answers: [3, 4], multi: true,
        explanation: "【正しい：4, 5】\n・消滅放射線のエネルギーは核種によらず一定(511 keV)です。\n・投与量と真の同時計数は比例します（※高放射能下で数え落としがない場合）。\n・飛程が長いと空間分解能は低下します。\n・エネルギー分解能は LSO > BGO です。"
      },
      {
        id: "pet_3", slide: 1, category: "PET装置",
        question: "3 院内製造の 18F-FDG 合成に必要な装置・設備はどれか。2つ選べ。",
        options: ["1. 注入装置", "2. ホットラボ", "3. 陽電子準備室", "4. 陽電子診療室", "5. 68Ge-68Ga ジェネレータ"],
        answers: [1, 2], multi: true,
        explanation: "【正しい：2, 3】院内での18F-FDG合成には「ホットラボ」および「陽電子準備室」が必要です。\n※陽電子診療室は投与・検査を行う場所です。"
      },
      {
        id: "pet_4", slide: 1, category: "PET装置",
        question: "4 PET 装置で誤っているのはどれか。",
        options: ["1. 偶発同時計数は放射能の二乗に比例する。", "2. 偶発同時計数は遅延同時計数により推定できる。", "3. 偶発同時計数はタイムウィンドウ幅に依存する。", "4. 散乱同時計数は TDCS 法により補正される。", "5. 散乱同時計数はエネルギーウィンドウ幅に依存する。"],
        answers: [3], multi: false,
        explanation: "【誤り：4】散乱同時計数は DEW（ダブルエネルギーウィンドウ）法や SSS（Single Scatter Simulation）法などによって補正されます。"
      },
      {
        id: "pet_5", slide: 1, category: "PET装置",
        question: "5 PET の記述で誤っているのはどれか。",
        options: ["1. 計数率が高くなるほど偶発同時計数の割合は高くなる。", "2. 散乱同時計数は、被写体が大きいと増加する。", "3. 円柱ファントムの画像は、散乱補正をしても均一にならない。", "4. 円柱ファントムの画像は、減弱補正をすると中心部が低くなる。", "5. 陽電子のエネルギーが低いと空間分解能は高い。"],
        answers: [3], multi: false,
        explanation: "【誤り：4】減弱補正を行うことで中心部の落ち込みが正しく修正され均一になります。減弱補正をしない（未補正）の場合に中心部が低くなります。"
      },
      {
        id: "pet_6", slide: 1, category: "PET装置",
        question: "6 Silicon photomultiplier (SiPM) PET 検出器で正しいのはどれか。",
        options: ["1. 冷却が必要である。", "2. 磁場の影響を受ける。", "3. 光子数を求めることができない。", "4. 光電子増倍管より時間分解能が低い。", "5. 物理的サイズは光電子増倍管と同等である。"],
        answers: [0], multi: false,
        explanation: "【正しい：1】SiPMは温度変化によるゲイン変動を防ぐために冷却（温度管理）が必要です。\n※半導体素子のため磁場に強く、PET/MRIへの応用に優れます。"
      },
      {
        id: "pet_7", slide: 1, category: "PET装置",
        question: "7 ガンマ線計測に使用されるシンチレータで誤っているのはどれか。",
        options: ["1. LSOはGSOより発光量が大きい。", "2. NaI はBGOより減衰時間が短い。", "3. GSO は NaI より密度が大きい。", "4. BGOはLSOより実効原子番号が大きい。", "5. LSOはGSOよりエネルギー分解能に優れる。"],
        answers: [4], multi: false,
        explanation: "【誤り：5】エネルギー分解能順は NaI > GSO > LSO > BGO です。LSOがGSOより優れているわけではありません。"
      },
      {
        id: "pet_8", slide: 1, category: "PET装置",
        question: "8 PET 装置で誤っているのはどれか。",
        options: ["1. 68Ge-68Ga は吸収補正用の外部線源として用いられる。", "2. 部分容積効果はシステムの分解能に依存する。", "3. 多数の結晶に複数の光電子増倍管を配列したブロック検出器を用いる。", "4. 同時計数には真の同時計数、偶発同時計数および散乱同時計数がある。", "5. 雑音等価計数率は放射能濃度に比例して大きくなる。"],
        answers: [4], multi: false,
        explanation: "【誤り：5】雑音等価計数率(NECR)は放射能濃度が高くなると偶発同時計数や不感時間損失の影響で増加が打ち消され、ピーク後減少します。"
      },
      {
        id: "pet_9", slide: 1, category: "PET装置",
        question: "9 SPECT 装置とPET装置とで共通するのはどれか。2つ選べ。",
        options: ["1. 光電子増倍管", "2. シンチレータ", "3. ライトガイド", "4. 同時計数回路", "5. コリメータ"],
        answers: [0, 1], multi: true,
        explanation: "【正しい：1, 2】光電子増倍管(PMT)とシンチレータはどちらの装置でも共通して使用されます。コリメータはSPECT特有、同時計数回路はPET特有です。"
      },
      {
        id: "pet_10", slide: 1, category: "PET装置",
        question: "10 PET 装置の性能評価項目でないのはどれか。",
        options: ["1. 感度", "2. 空間分解能", "3. 計数率特性", "4. エネルギー分解能", "5. 散乱フラクション"],
        answers: [3], multi: false,
        explanation: "【誤り：4】NEMA規格におけるPET装置の主な性能評価項目は「空間分解能」「感度」「計数率特性」「散乱フラクション」「画質」です。"
      },
      {
        id: "pet_11", slide: 1, category: "PET装置",
        question: "11 PETの安全管理で正しいのはどれか。",
        options: ["1. 陽電子診療室は撮影操作をする場所である。", "2. 1室に複数の陽電子断層撮影装置を設置できる。", "3. PET 用放射性医薬品の投与は陽電子準備室で行う。", "4. 陽電子待機室の設置目的は被検者以外の被ばく防止である。", "5. 診療にあたる診療放射線技師は、所定の研修を修了しなければならない。"],
        answers: [3], multi: false,
        explanation: "【正しい：4】陽電子待機室は投与後の患者からの第三者への不要な被ばくを防止するために設置されます。装置設置は原則1室1台です。"
      },

    // --- 各分野の情報定義 ---
    const sectionsMeta = [
      { id: 1, title: "PET装置", count: 20, icon: "fa-ring" },
      { id: 2, title: "内分泌・腫瘍", count: 20, icon: "fa-dna" },

      { id: 7, title: "放射性医薬品・治療", count: 20, icon: "fa-vial" },

    ];

    // --- 状態管理 ---
    let state = {
      darkMode: false,
      userAnswers: {}, // { [questionId]: { answers: [], isCorrect: bool } }
      bookmarks: [], // [ questionId, ... ]
      wrongQuestions: [], // [ questionId, ... ]
      settings: {
        shuffleQuestions: false,
        shuffleOptions: false
      },
      // クイズ実行時状態
      currentQuiz: {
        mode: '', // 'section', 'random_all', 'bookmarks', 'wrong'
        sectionId: null,
        questions: [],
        currentIndex: 0,
        userSelections: [],
        isSubmitted: false,
        results: [] // 各問の結果
      }
    };

    // 初期化
    window.addEventListener('DOMContentLoaded', () => {
      loadStorage();
      initTheme();
      renderDashboard();
    });

    // --- ローカルストレージ管理 ---
    function loadStorage() {
      try {
        const saved = localStorage.getItem('pet_quiz_state_v1');
        if (saved) {
          const parsed = JSON.parse(saved);
          state.userAnswers = parsed.userAnswers || {};
          state.bookmarks = parsed.bookmarks || [];
          state.wrongQuestions = parsed.wrongQuestions || [];
          state.settings = parsed.settings || state.settings;
          state.darkMode = parsed.darkMode || false;
        }
      } catch (e) {
        console.error("Storage load error", e);
      }
    }

    function saveStorage() {
      try {
        localStorage.setItem('pet_quiz_state_v1', JSON.stringify({
          userAnswers: state.userAnswers,
          bookmarks: state.bookmarks,
          wrongQuestions: state.wrongQuestions,
          settings: state.settings,
          darkMode: state.darkMode
        }));
      } catch (e) {
        console.error("Storage save error", e);
      }
    }

    // テーマ切り替え
    function initTheme() {
      if (state.darkMode) {
        document.documentElement.classList.add('dark');
        document.getElementById('theme-icon').className = 'fas fa-sun text-lg text-amber-400';
      } else {
        document.documentElement.classList.remove('dark');
        document.getElementById('theme-icon').className = 'fas fa-moon text-lg text-slate-500';
      }
    }

    function toggleDarkMode() {
      state.darkMode = !state.darkMode;
      initTheme();
      saveStorage();
    }

    // --- ダッシュボード描画 ---
    function renderDashboard() {
      // 統計情報計算
      const totalAnswered = Object.keys(state.userAnswers).length;
      const correctCount = Object.values(state.userAnswers).filter(a => a.isCorrect).length;
      const accuracy = totalAnswered > 0 ? Math.round((correctCount / totalAnswered) * 100) : 0;

      document.getElementById('stat-answered').textContent = `${totalAnswered} / 160`;
      document.getElementById('stat-accuracy').textContent = `${accuracy}%`;
      document.getElementById('stat-bookmarks').textContent = state.bookmarks.length;
      document.getElementById('stat-wrong').textContent = state.wrongQuestions.length;

      document.getElementById('btn-bookmark-count').textContent = state.bookmarks.length;
      document.getElementById('btn-wrong-count').textContent = state.wrongQuestions.length;

      // 設定トグル状態
      document.getElementById('setting-shuffle-q').checked = state.settings.shuffleQuestions;
      document.getElementById('setting-shuffle-o').checked = state.settings.shuffleOptions;

      // イベント割り当て
      document.getElementById('setting-shuffle-q').onchange = (e) => {
        state.settings.shuffleQuestions = e.target.checked;
        saveStorage();
      };
      document.getElementById('setting-shuffle-o').onchange = (e) => {
        state.settings.shuffleOptions = e.target.checked;
        saveStorage();
      };

      // セクションカードの生成
      const grid = document.getElementById('section-grid');
      grid.innerHTML = '';

      sectionsMeta.forEach(sec => {
        const secQuestions = rawQuizData.filter(q => q.slide === sec.id);
        const answeredSec = secQuestions.filter(q => state.userAnswers[q.id]);
        const correctSec = secQuestions.filter(q => state.userAnswers[q.id] && state.userAnswers[q.id].isCorrect);
        const secAccuracy = answeredSec.length > 0 ? Math.round((correctSec.length / answeredSec.length) * 100) : 0;

        const card = document.createElement('div');
        card.className = "bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm hover:shadow-md transition cursor-pointer flex flex-col justify-between space-y-4 group";
        card.onclick = () => startMode('section', sec.id);

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-3">
              <span class="w-10 h-10 rounded-xl bg-indigo-50 dark:bg-indigo-950/80 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-lg group-hover:scale-110 transition-transform">
                <i class="fas ${sec.icon}"></i>
              </span>
              <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">
                Slide ${sec.id}
              </span>
            </div>
            <h3 class="font-bold text-base text-slate-800 dark:text-slate-100 mb-1 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors">${sec.title}</h3>
            <p class="text-xs text-slate-500 dark:text-slate-400">全 ${sec.count} 問</p>
          </div>

          <div class="space-y-1.5 border-t pt-3 border-slate-100 dark:border-slate-700/60">
            <div class="flex justify-between text-xs">
              <span class="text-slate-500 dark:text-slate-400">進捗度</span>
              <span class="font-bold text-slate-700 dark:text-slate-200">${answeredSec.length} / ${sec.count} (${secAccuracy}%)</span>
            </div>
            <div class="w-full bg-slate-100 dark:bg-slate-700 h-1.5 rounded-full overflow-hidden">
              <div class="bg-indigo-600 h-full rounded-full" style="width: ${(answeredSec.length / sec.count) * 100}%"></div>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function showDashboard() {
      document.getElementById('view-dashboard').classList.remove('hidden');
      document.getElementById('view-quiz').classList.add('hidden');
      document.getElementById('view-result').classList.add('hidden');
      renderDashboard();
    }

    // --- クイズモード開始 ---
    function startMode(mode, sectionId = null) {
      let questions = [];

      if (mode === 'section') {
        questions = rawQuizData.filter(q => q.slide === sectionId);
      } else if (mode === 'random_all') {
        questions = [...rawQuizData];
      } else if (mode === 'bookmarks') {
        questions = rawQuizData.filter(q => state.bookmarks.includes(q.id));
        if (questions.length === 0) {
          alert('ブックマークされた問題がありません。');
          return;
        }
      } else if (mode === 'wrong') {
        questions = rawQuizData.filter(q => state.wrongQuestions.includes(q.id));
        if (questions.length === 0) {
          alert('要復習（間違えた）問題がありません！素晴らしい！');
          return;
        }
      }

      // 問題順シャッフル
      if (state.settings.shuffleQuestions || mode === 'random_all') {
        questions = arrayShuffle([...questions]);
      }

      state.currentQuiz = {
        mode: mode,
        sectionId: sectionId,
        questions: questions,
        currentIndex: 0,
        userSelections: [],
        isSubmitted: false,
        results: []
      };

      document.getElementById('view-dashboard').classList.add('hidden');
      document.getElementById('view-quiz').classList.remove('hidden');
      document.getElementById('view-result').classList.add('hidden');

      renderCurrentQuestion();
    }

    function arrayShuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    // --- 現在の問題の表示 ---
    function renderCurrentQuestion() {
      const qState = state.currentQuiz;
      const q = qState.questions[qState.currentIndex];

      qState.userSelections = [];
      qState.isSubmitted = false;

      // カテゴリ・進捗バッジ
      document.getElementById('quiz-category-badge').textContent = `${q.category} (Slide ${q.slide})`;
      document.getElementById('quiz-progress-text').textContent = `問題 ${qState.currentIndex + 1} / ${qState.questions.length}`;
      
      const progressPercent = ((qState.currentIndex) / qState.questions.length) * 100;
      document.getElementById('quiz-progress-bar').style.width = `${progressPercent}%`;

      // 複数選択バッジ
      const multiBadge = document.getElementById('quiz-multi-badge');
      if (q.multi) {
        multiBadge.textContent = "複数選択（2つ選べ）";
        multiBadge.className = "shrink-0 px-2.5 py-1 text-xs font-bold rounded-lg bg-amber-100 dark:bg-amber-950 text-amber-700 dark:text-amber-300";
      } else {
        multiBadge.textContent = "単一選択";
        multiBadge.className = "shrink-0 px-2.5 py-1 text-xs font-bold rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300";
      }

      // ブックマーク状態
      updateBookmarkIconState(q.id);

      // 問題文
      document.getElementById('quiz-question-text').textContent = q.question;

      // 選択肢作成 (シャッフル設定反映)
      let optionsWithIndex = q.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
      if (state.settings.shuffleOptions) {
        optionsWithIndex = arrayShuffle(optionsWithIndex);
      }

      const container = document.getElementById('quiz-options-container');
      container.innerHTML = '';

      optionsWithIndex.forEach((item) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.dataset.origIdx = item.originalIndex;
        btn.className = "w-full text-left p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:border-indigo-400 dark:hover:border-indigo-500 transition flex items-center justify-between select-none space-x-3";
        btn.onclick = () => selectOption(item.originalIndex, btn, q.multi);

        btn.innerHTML = `
          <div class="flex items-center space-x-3">
            <span class="option-check-icon w-5 h-5 rounded-full border border-slate-300 dark:border-slate-600 flex items-center justify-center shrink-0 text-xs"></span>
            <span class="text-sm md:text-base font-medium">${item.text}</span>
          </div>
        `;
        container.appendChild(btn);
      });

      // 解説エリアリセット
      document.getElementById('quiz-explanation-box').classList.add('hidden');
      document.getElementById('btn-submit-answer').classList.remove('hidden');
      document.getElementById('btn-next-question').classList.add('hidden');
    }

    // 選択肢クリック処理
    function selectOption(origIndex, element, isMulti) {
      if (state.currentQuiz.isSubmitted) return;

      const qState = state.currentQuiz;

      if (isMulti) {
        // 複数選択
        if (qState.userSelections.includes(origIndex)) {
          qState.userSelections = qState.userSelections.filter(i => i !== origIndex);
          element.classList.remove('border-indigo-600', 'bg-indigo-50/50', 'dark:bg-indigo-950/30');
          element.querySelector('.option-check-icon').innerHTML = '';
          element.querySelector('.option-check-icon').className = 'option-check-icon w-5 h-5 rounded-full border border-slate-300 dark:border-slate-600 flex items-center justify-center shrink-0 text-xs';
        } else {
          qState.userSelections.push(origIndex);
          element.classList.add('border-indigo-600', 'bg-indigo-50/50', 'dark:bg-indigo-950/30');
          element.querySelector('.option-check-icon').innerHTML = '<i class="fas fa-check text-indigo-600 dark:text-indigo-400"></i>';
          element.querySelector('.option-check-icon').className = 'option-check-icon w-5 h-5 rounded-full border border-indigo-600 bg-indigo-100 dark:bg-indigo-900 flex items-center justify-center shrink-0 text-xs';
        }
      } else {
        // 単一選択
        qState.userSelections = [origIndex];
        const container = document.getElementById('quiz-options-container');
        Array.from(container.children).forEach(child => {
          child.classList.remove('border-indigo-600', 'bg-indigo-50/50', 'dark:bg-indigo-950/30');
          child.querySelector('.option-check-icon').innerHTML = '';
          child.querySelector('.option-check-icon').className = 'option-check-icon w-5 h-5 rounded-full border border-slate-300 dark:border-slate-600 flex items-center justify-center shrink-0 text-xs';
        });

        element.classList.add('border-indigo-600', 'bg-indigo-50/50', 'dark:bg-indigo-950/30');
        element.querySelector('.option-check-icon').innerHTML = '<i class="fas fa-circle text-xs text-indigo-600 dark:text-indigo-400"></i>';
        element.querySelector('.option-check-icon').className = 'option-check-icon w-5 h-5 rounded-full border border-indigo-600 flex items-center justify-center shrink-0 text-xs';
      }
    }

    // 解答送信
    function submitAnswer() {
      const qState = state.currentQuiz;
      if (qState.userSelections.length === 0) {
        alert('解答を選択してください。');
        return;
      }

      qState.isSubmitted = true;
      const q = qState.questions[qState.currentIndex];

      // 正解判定
      const sortedUser = [...qState.userSelections].sort();
      const sortedAns = [...q.answers].sort();
      const isCorrect = JSON.stringify(sortedUser) === JSON.stringify(sortedAns);

      // 記録更新
      state.userAnswers[q.id] = { answers: sortedUser, isCorrect: isCorrect };
      if (isCorrect) {
        state.wrongQuestions = state.wrongQuestions.filter(id => id !== q.id);
      } else {
        if (!state.wrongQuestions.includes(q.id)) {
          state.wrongQuestions.push(q.id);
        }
      }
      qState.results.push(isCorrect);
      saveStorage();

      // UIハイライト処理
      const container = document.getElementById('quiz-options-container');
      Array.from(container.children).forEach(child => {
        const idx = parseInt(child.dataset.origIdx);
        const isTargetAns = q.answers.includes(idx);
        const isUserSelected = qState.userSelections.includes(idx);

        if (isTargetAns) {
          child.className = "w-full text-left p-4 rounded-xl border-2 border-emerald-500 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-900 dark:text-emerald-100 flex items-center justify-between space-x-3";
          child.querySelector('.option-check-icon').innerHTML = '<i class="fas fa-check text-emerald-600"></i>';
          child.querySelector('.option-check-icon').className = 'option-check-icon w-5 h-5 rounded-full border border-emerald-500 bg-emerald-200 dark:bg-emerald-800 flex items-center justify-center shrink-0 text-xs';
        } else if (isUserSelected && !isTargetAns) {
          child.className = "w-full text-left p-4 rounded-xl border-2 border-rose-500 bg-rose-50 dark:bg-rose-950/40 text-rose-900 dark:text-rose-100 flex items-center justify-between space-x-3";
          child.querySelector('.option-check-icon').innerHTML = '<i class="fas fa-times text-rose-600"></i>';
          child.querySelector('.option-check-icon').className = 'option-check-icon w-5 h-5 rounded-full border border-rose-500 bg-rose-200 dark:bg-rose-800 flex items-center justify-center shrink-0 text-xs';
        }
      });

      // 解説表示
      const expBox = document.getElementById('quiz-explanation-box');
      const expTitle = document.getElementById('quiz-result-title');
      const expText = document.getElementById('quiz-explanation-text');

      expBox.classList.remove('hidden');
      if (isCorrect) {
        expBox.className = "p-5 rounded-xl border border-emerald-200 dark:border-emerald-800/60 bg-emerald-50/60 dark:bg-emerald-950/30 space-y-3";
        expTitle.className = "flex items-center space-x-2 font-bold text-lg text-emerald-600 dark:text-emerald-400";
        expTitle.innerHTML = '<i class="far fa-check-circle text-2xl"></i> <span>正解！</span>';
      } else {
        expBox.className = "p-5 rounded-xl border border-rose-200 dark:border-rose-800/60 bg-rose-50/60 dark:bg-rose-950/30 space-y-3";
        expTitle.className = "flex items-center space-x-2 font-bold text-lg text-rose-600 dark:text-rose-400";
        expTitle.innerHTML = '<i class="far fa-times-circle text-2xl"></i> <span>不正解...</span>';
      }

      expText.textContent = q.explanation;

      document.getElementById('btn-submit-answer').classList.add('hidden');
      document.getElementById('btn-next-question').classList.remove('hidden');
    }

    // 次の問題へ
    function nextQuestion() {
      const qState = state.currentQuiz;
      qState.currentIndex++;

      if (qState.currentIndex < qState.questions.length) {
        renderCurrentQuestion();
      } else {
        showQuizResult();
      }
    }

    // 結果表示
    function showQuizResult() {
      document.getElementById('view-quiz').classList.add('hidden');
      document.getElementById('view-result').classList.remove('hidden');

      const qState = state.currentQuiz;
      const total = qState.questions.length;
      const correctCount = qState.results.filter(r => r).length;
      const percent = Math.round((correctCount / total) * 100);

      document.getElementById('result-score-percent').textContent = `${percent}%`;
      document.getElementById('result-score-detail').textContent = `${total}問中 ${correctCount}問正解`;
    }

    function restartCurrentQuiz() {
      startMode(state.currentQuiz.mode, state.currentQuiz.sectionId);
    }

    // ブックマーク切り替え
    function updateBookmarkIconState(qId) {
      const btn = document.getElementById('quiz-bookmark-btn');
      if (state.bookmarks.includes(qId)) {
        btn.className = "text-amber-500 text-xl transition";
        btn.innerHTML = '<i class="fas fa-bookmark"></i>';
      } else {
        btn.className = "text-slate-400 hover:text-amber-500 text-xl transition";
        btn.innerHTML = '<i class="far fa-bookmark"></i>';
      }
    }

    function toggleBookmarkCurrent() {
      const q = state.currentQuiz.questions[state.currentQuiz.currentIndex];
      if (state.bookmarks.includes(q.id)) {
        state.bookmarks = state.bookmarks.filter(id => id !== q.id);
      } else {
        state.bookmarks.push(q.id);
      }
      saveStorage();
      updateBookmarkIconState(q.id);
    }
  </script>
</body>
</html>
